services:
  - type: web
    name: starsee
    runtime: static
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm test && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
